project:
  cache_dir: ./cache
  output_dir: ./output

llm:
  profiles:
    # Candidate: OpenAI main model.
    # Use this for audio, merge, and strong visual description stages.
    # Rate limits are per profile. null means unlimited.
    openai_gpt_main: &openai_gpt_main
      provider: openai_responses
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-5
      capabilities: [vision, prompt_cache, json_mode, reasoning]
      max_context: 1000000
      timeout_seconds: 3000
      reasoning_effort: medium
      rpm_limit: null
      tpm_limit: null

    # Candidate: cheap/fast VLM for visual judging.
    # Rate limits are per profile. null means unlimited.
    openrouter_weak_vlm: &openrouter_weak_vlm
      provider: openai_compatible_chat
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model: google/gemini-2.5-flash
      capabilities: [vision]
      timeout_seconds: 3000
      rpm_limit: null
      tpm_limit: null

    # Candidate: custom OpenAI-compatible text endpoint.
    # Local endpoints may use api_key_env: null. Remote endpoints should use an env var.
    custom_gpt_main: &custom_gpt_main
      provider: openai_compatible_chat
      base_url: http://localhost:8000/v1
      api_key_env: null
      model: your-text-model
      capabilities: [json_mode]
      max_context: 128000
      timeout_seconds: 3000

    # Candidate: custom weak VLM for visual judging.
    custom_weak_vlm: &custom_weak_vlm
      provider: openai_compatible_chat
      base_url: http://localhost:8000/v1
      api_key_env: null
      model: your-fast-vlm-model
      capabilities: [vision, json_mode]
      timeout_seconds: 3000

    # Candidate: custom strong VLM for detailed visual descriptions.
    custom_strong_vlm: &custom_strong_vlm
      provider: openai_compatible_chat
      base_url: http://localhost:8000/v1
      api_key_env: null
      model: your-strong-vlm-model
      capabilities: [vision, json_mode]
      max_context: 128000
      timeout_seconds: 3000

    # Active stable interfaces used by tasks.
    # Switch providers by changing only these aliases.
    gpt_main:
      <<: *openai_gpt_main

    weak_vlm:
      <<: *openrouter_weak_vlm

    strong_vlm:
      <<: *openai_gpt_main

tasks:
  segment: gpt_main
  refine: gpt_main
  outline: gpt_main
  section: gpt_main
  slide_judge: weak_vlm
  slide_describe: strong_vlm

asr:
  backend: faster_whisper_local
  model: large-v3
  device: auto
  compute_type: auto
  use_batched: true
  batch_size: 16
  vad: true
  language: zh

audio_pipeline:
  extract:
    sample_rate: 16000
    channels: 1
  segment: {}
  refine:
    mode: adaptive
    batch_size: 8

visual_pipeline:
  sample:
    fps: 1
  cluster:
    phash_low_threshold: 5
    phash_high_threshold: 15

merge:
  outline:
    target_chapter_count_hint: "5-12"
  section:
    concurrent_calls: 5
  assemble:
    timestamp_format: "[{hms}]"
    include_toc: true
    include_metadata: true
    video_url_template: null
    top_title: null
