<svg width="100%" viewBox="0 0 680 650" role="img" xmlns="http://www.w3.org/2000/svg" font-family='"Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' font-size="14">
  <title>LongVideo-Notes 处理流程</title>
  <desc>从输入文件经音频管线(左,青色,必经)和多模管线(右,紫色,仅多模模式启用)处理。多模管线 stage 5 (describe) 依赖音频管线 refined_transcript。两条管线最终汇入合并阶段生成 note.md;纯音频模式下多模管线整体跳过,合并阶段仅消费 AudioArtifacts。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="406" y="106" width="208" height="392" rx="12" fill="none"
        stroke="rgb(83, 74, 183)" stroke-width="1" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="610" y="100" text-anchor="end"
        fill="rgb(83, 74, 183)" font-size="11" font-weight="500">仅多模模式启用</text>
  <rect x="240" y="40" width="200" height="44" rx="8"
        fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central"
        fill="rgb(68, 68, 65)" font-weight="500">输入文件</text>
  <path d="M340 84 L340 100 L170 100 L170 120" fill="none"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 100 L510 100 L510 120" fill="none"
        stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="80" y="120" width="180" height="44" rx="8"
        fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="170" y="142" text-anchor="middle" dominant-baseline="central"
        fill="rgb(8, 80, 65)" font-weight="500">1. extract</text>
  <line x1="170" y1="164" x2="170" y2="205"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="205" width="180" height="44" rx="8"
        fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="170" y="227" text-anchor="middle" dominant-baseline="central"
        fill="rgb(8, 80, 65)" font-weight="500">2. transcribe</text>
  <line x1="170" y1="249" x2="170" y2="290"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="290" width="180" height="44" rx="8"
        fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="170" y="312" text-anchor="middle" dominant-baseline="central"
        fill="rgb(8, 80, 65)" font-weight="500">3. segment</text>
  <line x1="170" y1="334" x2="170" y2="376"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="376" width="180" height="44" rx="8"
        fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="170" y="398" text-anchor="middle" dominant-baseline="central"
        fill="rgb(8, 80, 65)" font-weight="500">4. refine</text>
  <line x1="170" y1="420" x2="170" y2="440"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="120" width="180" height="44" rx="8"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="510" y="142" text-anchor="middle" dominant-baseline="central"
        fill="rgb(60, 52, 137)" font-weight="500">1. sample</text>
  <line x1="510" y1="164" x2="510" y2="180"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="180" width="180" height="44" rx="8"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="510" y="202" text-anchor="middle" dominant-baseline="central"
        fill="rgb(60, 52, 137)" font-weight="500">2. cluster</text>
  <line x1="510" y1="224" x2="510" y2="240"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="240" width="180" height="44" rx="8"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="510" y="262" text-anchor="middle" dominant-baseline="central"
        fill="rgb(60, 52, 137)" font-weight="500">3. judge</text>
  <line x1="510" y1="284" x2="510" y2="300"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="300" width="180" height="44" rx="8"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="510" y="322" text-anchor="middle" dominant-baseline="central"
        fill="rgb(60, 52, 137)" font-weight="500">4. select</text>
  <line x1="510" y1="344" x2="510" y2="376"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="420" y="376" width="180" height="44" rx="8"
        fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="510" y="398" text-anchor="middle" dominant-baseline="central"
        fill="rgb(60, 52, 137)" font-weight="500">5. describe</text>
  <line x1="510" y1="420" x2="510" y2="440"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="398" x2="420" y2="398"
        stroke="rgb(153, 60, 29)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="340" y="392" text-anchor="middle"
        fill="rgb(113, 43, 19)" font-size="12">refined_transcript</text>
  <rect x="80" y="440" width="180" height="44" rx="8"
        fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="170" y="462" text-anchor="middle" dominant-baseline="central"
        fill="rgb(68, 68, 65)" font-weight="500">AudioArtifacts</text>
  <rect x="420" y="440" width="180" height="44" rx="8"
        fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="510" y="462" text-anchor="middle" dominant-baseline="central"
        fill="rgb(68, 68, 65)" font-weight="500">VisualArtifacts</text>
  <path d="M170 484 L170 500 L270 500 L270 520" fill="none"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510 484 L510 500 L410 500 L410 520" fill="none"
        stroke="rgb(83, 74, 183)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="160" y="520" width="360" height="56" rx="8"
        fill="rgb(250, 236, 231)" stroke="rgb(153, 60, 29)" stroke-width="0.5"/>
  <text x="340" y="538" text-anchor="middle" dominant-baseline="central"
        fill="rgb(113, 43, 19)" font-weight="500">合并阶段</text>
  <text x="340" y="558" text-anchor="middle" dominant-baseline="central"
        fill="rgb(153, 60, 29)" font-size="12">unify → outline → section → assemble</text>
  <line x1="340" y1="576" x2="340" y2="592"
        stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="592" width="100" height="44" rx="8"
        fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="340" y="614" text-anchor="middle" dominant-baseline="central"
        fill="rgb(68, 68, 65)" font-weight="500">note.md</text>
</svg>