project:
  cache_dir: ./cache
  output_dir: ./output

llm:
  profiles:
    # Candidate: custom OpenAI-compatible text endpoint.
    # Local endpoints may use api_key_env: null. Remote endpoints should use an env var.
    deepseek_flash: &deepseek_flash
      provider: openai_compatible_chat
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-flash
      capabilities: [json_mode, reasoning]
      max_context: 1000000
      timeout_seconds: 3000
      reasoning_effort: medium
      rpm_limit: null
      tpm_limit: null

    deepseek_pro: &deepseek_pro
      provider: openai_compatible_chat
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-v4-pro
      capabilities: [json_mode, reasoning]
      max_context: 1000000
      timeout_seconds: 3000
      reasoning_effort: medium
      rpm_limit: null
      tpm_limit: null

    # Candidate: custom weak VLM for visual judging.
    weak_vlm: &weak_vlm
      provider: openai_compatible_chat
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      model: Qwen/Qwen3.6-27B
      capabilities: [vision, json_mode]
      max_context: 128000
      timeout_seconds: 3000
      rpm_limit: 1000
      tpm_limit: 40000

    # Candidate: custom strong VLM for detailed visual descriptions.
    strong_vlm: &strong_vlm
      provider: openai_compatible_chat
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      model: Pro/moonshotai/Kimi-K2.6
      capabilities: [vision, json_mode]
      max_context: 128000
      timeout_seconds: 3000
      rpm_limit: 500
      tpm_limit: 2000000

tasks:
  segment: deepseek_pro
  refine: deepseek_pro
  outline: deepseek_pro
  section: deepseek_pro
  slide_judge: weak_vlm
  slide_describe: strong_vlm

asr:
  backend: faster_whisper_local
  model: large-v3
  device: auto
  compute_type: auto
  use_batched: true
  batch_size: 16
  vad: true
  language: zh

audio_pipeline:
  extract:
    sample_rate: 16000
    channels: 1
  segment: {}
  refine:
    mode: adaptive
    batch_size: 8

visual_pipeline:
  filter:
    detector: content
    threshold: auto
    auto_threshold_candidates: [10.0, 15.0, 20.0, 25.0, 27.0, 30.0, 35.0, 40.0]
    target_frames_per_minute: 1.5
    min_scene_len_seconds: 1.0
    representative: content
    candidate_fps: 3.0
    min_content_score: 0.5
    duplicate_pixel_mean_threshold: 0.025
  describe:
    concurrent_calls: 5
merge:
  outline:
    target_chapter_count_hint: "5-12"
  section:
    concurrent_calls: 5
  assemble:
    timestamp_format: "[{hms}]"
    include_toc: true
    include_metadata: true
    video_url_template: null
    top_title: null
