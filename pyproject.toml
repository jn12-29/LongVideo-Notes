[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longvideo-notes"
version = "0.1.0"
description = "Local CLI for turning long video or audio into structured Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "click",
  "jinja2",
  "openai",
  "pillow",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "tenacity",
  "tqdm",
]

[project.optional-dependencies]
asr = ["faster-whisper"]
dev = [
  "import-linter",
  "pytest",
  "ruff",
]

[project.scripts]
lvnotes = "lvnotes.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["lvnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
